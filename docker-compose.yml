services:
  postgres:
    image: postgres:17

    container_name: blog-api-postgres

    restart: always

    ports:
    - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_api

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: